<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>2‑up photo layout · print & save</title>

    <!-- PWA / offline support -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="2-up Photo">
    <meta name="theme-color" content="#007aff">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }
        .app {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
            padding: 24px 20px 28px;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 6px;
            color: #1d1d1f;
        }
        .subhead {
            text-align: center;
            font-size: 0.95rem;
            color: #6e6e73;
            margin-bottom: 22px;
            font-weight: 400;
            border-bottom: 1px solid #e9e9ed;
            padding-bottom: 16px;
        }
        .upload-row {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
        }
        .photo-slot {
            flex: 1;
            background: #f9f9fb;
            border-radius: 18px;
            border: 1.5px dashed #c6c6cc;
            padding: 12px 6px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
            cursor: pointer;
            outline: none;
        }
        .photo-slot:active {
            background: #f0f0f5;
            border-color: #007aff;
        }
        .photo-slot.filled {
            border-style: solid;
            border-color: #007aff;
            background: #ffffff;
        }
        .photo-slot.focus-target {
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.25);
            border-color: #007aff;
        }
        .slot-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6e6e73;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .preview-thumb {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #e9e9ed;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 2rem;
            color: #8e8e93;
            margin-bottom: 6px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }
        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #ffffff;
        }
        .file-input {
            display: none;
        }
        .slot-hint {
            font-size: 0.7rem;
            color: #8e8e93;
            font-weight: 400;
            text-align: center;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            margin-bottom: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            background: #f2f2f7;
            color: #1d1d1f;
            transition: opacity 0.2s, background 0.2s;
            text-align: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .btn-primary {
            background: #007aff;
            color: white;
            font-weight: 600;
        }
        .btn-primary:active {
            background: #005bbf;
        }
        .btn:active {
            opacity: 0.7;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: default;
        }
        .canvas-container {
            background: #f5f5f7;
            border-radius: 20px;
            padding: 16px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            min-height: 200px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }
        #previewCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            background: #ffffff;
            display: block;
            width: 100%;
            max-height: 320px;
            object-fit: contain;
        }
        .info-text {
            text-align: center;
            font-size: 0.75rem;
            color: #8e8e93;
            margin-top: 8px;
            line-height: 1.4;
        }
        .cut-line-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.72rem;
            color: #6e6e73;
            margin: 8px 0 4px;
        }
        .cut-line-note span {
            background: #e9e9ed;
            padding: 3px 10px;
            border-radius: 30px;
        }
        .gap-indicator {
            font-weight: 600;
            color: #007aff;
        }
        .status-msg {
            font-size: 0.8rem;
            text-align: center;
            min-height: 20px;
            color: #007aff;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>2‑up photo</h1>
    <div class="subhead">side‑by‑side · no crop · cut‑line gap</div>

    <!-- Upload row -->
    <div class="upload-row">
        <!-- Left photo -->
        <div class="photo-slot" id="slotLeft" role="button" tabindex="0" aria-label="Upload left photo">
            <div class="slot-label">Left</div>
            <div class="preview-thumb" id="thumbLeft">
                <span>＋</span>
            </div>
            <div class="slot-hint">tap to choose<br>or paste</div>
            <input type="file" id="fileLeft" class="file-input" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" />
        </div>
        <!-- Right photo -->
        <div class="photo-slot" id="slotRight" role="button" tabindex="0" aria-label="Upload right photo">
            <div class="slot-label">Right</div>
            <div class="preview-thumb" id="thumbRight">
                <span>＋</span>
            </div>
            <div class="slot-hint">tap to choose<br>or paste</div>
            <input type="file" id="fileRight" class="file-input" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" />
        </div>
    </div>

    <!-- Action buttons -->
    <div class="action-buttons">
        <button class="btn" id="resetBtn" aria-label="Reset all">Reset</button>
        <button class="btn btn-primary" id="exportBtn" disabled>Save JPEG</button>
    </div>

    <!-- Live preview area -->
    <div class="canvas-container">
        <canvas id="previewCanvas" width="1200" height="800"></canvas>
    </div>
    <div class="cut-line-note">
        <span>✂️ thin gap = cut line</span>
        <span class="gap-indicator" id="gapDisplay">3px</span>
    </div>
    <div class="info-text">
        Photos are scaled to equal height.<br>
        Landscape images auto‑rotated to portrait.<br>
        Exported at full resolution, high quality.
    </div>
    <div id="statusMessage" class="status-msg"></div>
</div>

<script>
    (function() {
        // ----- elements -----
        const slotLeft = document.getElementById('slotLeft');
        const slotRight = document.getElementById('slotRight');
        const fileLeft = document.getElementById('fileLeft');
        const fileRight = document.getElementById('fileRight');
        const thumbLeft = document.getElementById('thumbLeft');
        const thumbRight = document.getElementById('thumbRight');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctx = previewCanvas.getContext('2d');
        const gapDisplay = document.getElementById('gapDisplay');
        const statusMsg = document.getElementById('statusMessage');

        // ----- state -----
        let leftImage = null;        // HTMLImageElement or null
        let rightImage = null;

        // Which slot should receive a pasted image.
        // Starts as 'left' so the very first paste goes somewhere sensible.
        let pasteTarget = 'left';

        // Fixed gap in pixels for the final output (narrow but visible for cutting)
        const GAP_PX = 3;
        gapDisplay.textContent = GAP_PX + 'px';

        // Maximum canvas dimension for preview (not export)
        const PREVIEW_MAX_WIDTH = 1200;
        const PREVIEW_MAX_HEIGHT = 800;

        // ----- helper: show status message -----
        function setStatus(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.style.color = isError ? '#c0392b' : '#007aff';
            if (!text) statusMsg.textContent = '';
        }

        // ----- update the visual focus highlight on slots -----
        function updateFocusHighlight() {
            slotLeft.classList.toggle('focus-target', pasteTarget === 'left');
            slotRight.classList.toggle('focus-target', pasteTarget === 'right');
        }

        // ----- set paste target (called on tap/focus of a slot) -----
        function setPasteTarget(which) {
            pasteTarget = which;
            updateFocusHighlight();
        }

        // ----- enable/disable export -----
        function updateExportState() {
            exportBtn.disabled = !(leftImage && rightImage);
        }

        // ----- clear one slot -----
        function clearLeft() {
            revokeImageURL(leftImage);
            leftImage = null;
            thumbLeft.innerHTML = '<span>＋</span>';
            slotLeft.classList.remove('filled');
            fileLeft.value = '';
            updateExportState();
            drawPreview();
        }

        function clearRight() {
            revokeImageURL(rightImage);
            rightImage = null;
            thumbRight.innerHTML = '<span>＋</span>';
            slotRight.classList.remove('filled');
            fileRight.value = '';
            updateExportState();
            drawPreview();
        }

        // ----- reset all -----
        function resetAll() {
            clearLeft();
            clearRight();
            setStatus('');
            drawPreview();
        }

        // ----- load image from file, returns Promise<HTMLImageElement> -----
        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) {
                    reject(new Error('Not an image file'));
                    return;
                }
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    img._objectURL = url;
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Failed to load image'));
                };
                img.src = url;
            });
        }

        // ----- revoke old object URL if exists -----
        function revokeImageURL(img) {
            if (img && img._objectURL) {
                URL.revokeObjectURL(img._objectURL);
                img._objectURL = null;
            }
        }

        // ----- shared logic: take an image file and assign it to a slot -----
        async function assignImageToSlot(file, which) {
            try {
                setStatus('Loading photo…');
                const img = await loadImageFromFile(file);

                if (which === 'left') {
                    revokeImageURL(leftImage);
                    leftImage = img;
                    thumbLeft.innerHTML = '';
                    const thumbImg = document.createElement('img');
                    thumbImg.src = img._objectURL;
                    thumbImg.alt = 'Left photo';
                    thumbLeft.appendChild(thumbImg);
                    slotLeft.classList.add('filled');
                } else {
                    revokeImageURL(rightImage);
                    rightImage = img;
                    thumbRight.innerHTML = '';
                    const thumbImg = document.createElement('img');
                    thumbImg.src = img._objectURL;
                    thumbImg.alt = 'Right photo';
                    thumbRight.appendChild(thumbImg);
                    slotRight.classList.add('filled');
                }

                setStatus('');
                updateExportState();
                drawPreview();
            } catch (err) {
                setStatus('Could not load photo', true);
                console.error(err);
            }
        }

        // ----- handle file selection (left) -----
        async function handleLeftFile(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            setPasteTarget('left');
            await assignImageToSlot(file, 'left');
        }

        async function handleRightFile(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            setPasteTarget('right');
            await assignImageToSlot(file, 'right');
        }

        // ----- helper: pick the best slot for a paste when the user hasn't tapped one -----
        function choosePasteSlot() {
            // If one slot is empty and the other filled, use the empty one
            if (leftImage && !rightImage) return 'right';
            if (rightImage && !leftImage) return 'left';
            // Both empty or both filled: fall back to the current pasteTarget
            return pasteTarget;
        }

        // ----- extract an image File from a paste event -----
        function getImageFileFromClipboard(e) {
            const items = e.clipboardData?.items;
            if (items) {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) return file;
                    }
                }
            }
            // Fallback: some browsers expose .files directly
            const files = e.clipboardData?.files;
            if (files && files.length) {
                for (let i = 0; i < files.length; i++) {
                    if (files[i].type.startsWith('image/')) return files[i];
                }
            }
            return null;
        }

        // ----- global paste handler -----
        async function handlePaste(e) {
            const file = getImageFileFromClipboard(e);
            if (!file) {
                // Don't nag the user if they pasted text into some future text field;
                // only show a message if it looks like they tried to paste an image.
                // (We can't easily know, so just silently ignore non-image pastes.)
                return;
            }

            // If the user hasn't expressed a preference and one slot is open, use it.
            let target = pasteTarget;
            if (!leftImage && rightImage) target = 'left';
            else if (leftImage && !rightImage) target = 'right';
            else target = choosePasteSlot();

            // Prevent the browser from trying to navigate to the image
            e.preventDefault();

            // After pasting, advance the target so a second paste goes to the other slot
            // (if the other slot is empty). This makes two quick pastes fill both slots.
            setPasteTarget(target);
            await assignImageToSlot(file, target);

            // Auto-advance to the other slot if it's still empty
            if (target === 'left' && !rightImage) {
                setPasteTarget('right');
            } else if (target === 'right' && !leftImage) {
                setPasteTarget('left');
            }
        }

        // ----- helper: get effective dimensions after rotation -----
        function getEffectiveDimensions(img) {
            const isLandscape = img.width > img.height;
            return isLandscape
                ? { width: img.height, height: img.width }
                : { width: img.width, height: img.height };
        }

        // ----- helper: draw a single image onto a context, rotating if landscape -----
        function drawImageRotated(ctx, img, destX, destY, destW, destH) {
            const isLandscape = img.width > img.height;
            if (isLandscape) {
                ctx.save();
                ctx.translate(destX, destY);
                ctx.rotate(Math.PI / 2);
                ctx.drawImage(img, -destW, 0, destW, destH);
                ctx.restore();
            } else {
                ctx.drawImage(img, destX, destY, destW, destH);
            }
        }

        // ----- draw preview on canvas -----
        function drawPreview() {
            if (!leftImage && !rightImage) {
                previewCanvas.width = 600;
                previewCanvas.height = 400;
                ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                ctx.fillStyle = '#f0f0f5';
                ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
                ctx.font = '16px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.fillStyle = '#8e8e93';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Upload two photos', previewCanvas.width/2, previewCanvas.height/2);
                return;
            }

            if (!leftImage || !rightImage) {
                const img = leftImage || rightImage;
                if (!img) return;
                const eff = getEffectiveDimensions(img);
                const aspect = eff.width / eff.height;
                let w = Math.min(PREVIEW_MAX_WIDTH, eff.width);
                let h = w / aspect;
                if (h > PREVIEW_MAX_HEIGHT) {
                    h = PREVIEW_MAX_HEIGHT;
                    w = h * aspect;
                }
                w = Math.round(w);
                h = Math.round(h);
                previewCanvas.width = w;
                previewCanvas.height = h;
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
                drawImageRotated(ctx, img, 0, 0, w, h);
                return;
            }

            const leftEff = getEffectiveDimensions(leftImage);
            const rightEff = getEffectiveDimensions(rightImage);
            const targetHeight = Math.min(leftEff.height, rightEff.height);

            const leftScale = targetHeight / leftEff.height;
            const rightScale = targetHeight / rightEff.height;
            const leftScaledW = leftEff.width * leftScale;
            const rightScaledW = rightEff.width * rightScale;

            const naturalTotalWidth = leftScaledW + GAP_PX + rightScaledW;
            const naturalMaxHeight = targetHeight;

            const scaleW = PREVIEW_MAX_WIDTH / naturalTotalWidth;
            const scaleH = PREVIEW_MAX_HEIGHT / naturalMaxHeight;
            const previewScale = Math.min(scaleW, scaleH, 1.0);

            const previewWidth = Math.round(naturalTotalWidth * previewScale);
            const previewHeight = Math.round(naturalMaxHeight * previewScale);

            previewCanvas.width = previewWidth;
            previewCanvas.height = previewHeight;
            ctx.clearRect(0, 0, previewWidth, previewHeight);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, previewWidth, previewHeight);

            const leftDrawW = leftScaledW * previewScale;
            const leftDrawH = targetHeight * previewScale;
            const rightDrawW = rightScaledW * previewScale;
            const rightDrawH = targetHeight * previewScale;
            const scaledGap = GAP_PX * previewScale;

            drawImageRotated(ctx, leftImage, 0, 0, leftDrawW, leftDrawH);
            drawImageRotated(ctx, rightImage, leftDrawW + scaledGap, 0, rightDrawW, rightDrawH);
        }

        // ----- export full-resolution JPEG using toBlob -----
        function exportFullRes() {
            if (!leftImage || !rightImage) {
                setStatus('Please load both photos first', true);
                return;
            }

            const leftEff = getEffectiveDimensions(leftImage);
            const rightEff = getEffectiveDimensions(rightImage);
            const targetHeight = Math.min(leftEff.height, rightEff.height);

            const leftScale = targetHeight / leftEff.height;
            const rightScale = targetHeight / rightEff.height;
            const leftW = leftEff.width * leftScale;
            const rightW = rightEff.width * rightScale;

            const outWidth = Math.round(leftW + GAP_PX + rightW);
            const outHeight = Math.round(targetHeight);

            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = outWidth;
            fullCanvas.height = outHeight;
            const fullCtx = fullCanvas.getContext('2d');

            fullCtx.fillStyle = '#ffffff';
            fullCtx.fillRect(0, 0, outWidth, outHeight);

            drawImageRotated(fullCtx, leftImage, 0, 0, Math.round(leftW), outHeight);
            drawImageRotated(fullCtx, rightImage, Math.round(leftW) + GAP_PX, 0, Math.round(rightW), outHeight);

            const timestamp = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
            const filename = `2up-${timestamp}.jpg`;

            fullCanvas.toBlob(function(blob) {
                if (!blob) {
                    setStatus('Export failed — try again', true);
                    return;
                }
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = filename;
                link.href = blobUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 200);
                setStatus('✓ Exported print‑ready JPEG');
                setTimeout(() => setStatus(''), 2500);
            }, 'image/jpeg', 1.0);
        }

        // ----- attach event listeners -----
        // Tap / click on a slot sets it as the paste target and opens the picker
        slotLeft.addEventListener('click', () => {
            setPasteTarget('left');
            fileLeft.click();
        });
        slotRight.addEventListener('click', () => {
            setPasteTarget('right');
            fileRight.click();
        });

        // Focus also sets paste target (for keyboard users)
        slotLeft.addEventListener('focus', () => setPasteTarget('left'));
        slotRight.addEventListener('focus', () => setPasteTarget('right'));

        slotLeft.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                setPasteTarget('left');
                fileLeft.click();
            }
        });
        slotRight.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                setPasteTarget('right');
                fileRight.click();
            }
        });

        fileLeft.addEventListener('change', handleLeftFile);
        fileRight.addEventListener('change', handleRightFile);

        resetBtn.addEventListener('click', resetAll);
        exportBtn.addEventListener('click', exportFullRes);

        // Global paste — works anywhere on the page, routes to the right slot
        document.addEventListener('paste', handlePaste);

        window.addEventListener('beforeunload', () => {
            revokeImageURL(leftImage);
            revokeImageURL(rightImage);
        });

        // Prevent default drag & drop on slots
        [slotLeft, slotRight].forEach(slot => {
            slot.addEventListener('dragover', (e) => e.preventDefault());
            slot.addEventListener('drop', (e) => e.preventDefault());
        });

        // Drag & drop support (desktop convenience)
        slotLeft.addEventListener('drop', async (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files?.[0];
            if (file && file.type.startsWith('image/')) {
                setPasteTarget('left');
                await assignImageToSlot(file, 'left');
            }
        });
        slotRight.addEventListener('drop', async (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files?.[0];
            if (file && file.type.startsWith('image/')) {
                setPasteTarget('right');
                await assignImageToSlot(file, 'right');
            }
        });

        // Initial state
        setPasteTarget('left');
        drawPreview();
    })();
</script>

<!-- Service worker registration for offline support -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
</body>
</html>
