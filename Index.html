<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>2‑up photo layout · print & save</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }
        .app {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
            padding: 24px 20px 28px;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 6px;
            color: #1d1d1f;
        }
        .subhead {
            text-align: center;
            font-size: 0.95rem;
            color: #6e6e73;
            margin-bottom: 22px;
            font-weight: 400;
            border-bottom: 1px solid #e9e9ed;
            padding-bottom: 16px;
        }
        .upload-row {
            display: flex;
            gap: 14px;
            margin-bottom: 20px;
        }
        .photo-slot {
            flex: 1;
            background: #f9f9fb;
            border-radius: 18px;
            border: 1.5px dashed #c6c6cc;
            padding: 12px 6px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.15s, background 0.15s;
            cursor: pointer;
        }
        .photo-slot:active {
            background: #f0f0f5;
            border-color: #007aff;
        }
        .photo-slot.filled {
            border-style: solid;
            border-color: #007aff;
            background: #ffffff;
        }
        .slot-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #6e6e73;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .preview-thumb {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #e9e9ed;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 2rem;
            color: #8e8e93;
            margin-bottom: 6px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }
        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #ffffff;
        }
        .file-input {
            display: none;
        }
        .slot-hint {
            font-size: 0.7rem;
            color: #8e8e93;
            font-weight: 400;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            margin-bottom: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            background: #f2f2f7;
            color: #1d1d1f;
            transition: opacity 0.2s, background 0.2s;
            text-align: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        .btn-primary {
            background: #007aff;
            color: white;
            font-weight: 600;
        }
        .btn-primary:active {
            background: #005bbf;
        }
        .btn:active {
            opacity: 0.7;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: default;
        }
        .canvas-container {
            background: #f5f5f7;
            border-radius: 20px;
            padding: 16px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            min-height: 200px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }
        #previewCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            background: #ffffff;
            display: block;
            width: 100%;
            max-height: 320px;
            object-fit: contain;
        }
        .info-text {
            text-align: center;
            font-size: 0.75rem;
            color: #8e8e93;
            margin-top: 8px;
            line-height: 1.4;
        }
        .cut-line-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.72rem;
            color: #6e6e73;
            margin: 8px 0 4px;
        }
        .cut-line-note span {
            background: #e9e9ed;
            padding: 3px 10px;
            border-radius: 30px;
        }
        .gap-indicator {
            font-weight: 600;
            color: #007aff;
        }
        .status-msg {
            font-size: 0.8rem;
            text-align: center;
            min-height: 20px;
            color: #007aff;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>2‑up photo</h1>
    <div class="subhead">side‑by‑side · no crop · cut‑line gap</div>

    <!-- Upload row -->
    <div class="upload-row">
        <!-- Left photo -->
        <div class="photo-slot" id="slotLeft" role="button" tabindex="0" aria-label="Upload left photo">
            <div class="slot-label">Left</div>
            <div class="preview-thumb" id="thumbLeft">
                <span>＋</span>
            </div>
            <div class="slot-hint">tap to choose</div>
            <input type="file" id="fileLeft" class="file-input" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" />
        </div>
        <!-- Right photo -->
        <div class="photo-slot" id="slotRight" role="button" tabindex="0" aria-label="Upload right photo">
            <div class="slot-label">Right</div>
            <div class="preview-thumb" id="thumbRight">
                <span>＋</span>
            </div>
            <div class="slot-hint">tap to choose</div>
            <input type="file" id="fileRight" class="file-input" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" />
        </div>
    </div>

    <!-- Action buttons -->
    <div class="action-buttons">
        <button class="btn" id="resetBtn" aria-label="Reset all">Reset</button>
        <button class="btn btn-primary" id="exportBtn" disabled>Save JPEG</button>
    </div>

    <!-- Live preview area -->
    <div class="canvas-container">
        <canvas id="previewCanvas" width="1200" height="800"></canvas>
    </div>
    <div class="cut-line-note">
        <span>✂️ thin gap = cut line</span>
        <span class="gap-indicator" id="gapDisplay">3px</span>
    </div>
    <div class="info-text">
        Photos keep original aspect ratio.<br>
        Exported at full resolution, high quality.
    </div>
    <div id="statusMessage" class="status-msg"></div>
</div>

<script>
    (function() {
        // ----- elements -----
        const slotLeft = document.getElementById('slotLeft');
        const slotRight = document.getElementById('slotRight');
        const fileLeft = document.getElementById('fileLeft');
        const fileRight = document.getElementById('fileRight');
        const thumbLeft = document.getElementById('thumbLeft');
        const thumbRight = document.getElementById('thumbRight');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctx = previewCanvas.getContext('2d');
        const gapDisplay = document.getElementById('gapDisplay');
        const statusMsg = document.getElementById('statusMessage');

        // ----- state -----
        let leftImage = null;        // HTMLImageElement or null
        let rightImage = null;

        // Fixed gap in pixels for the final output (narrow but visible for cutting)
        const GAP_PX = 3;            // 3px gap – perfect for scissor cut guide
        gapDisplay.textContent = GAP_PX + 'px';

        // Maximum canvas dimension for preview (not export)
        const PREVIEW_MAX_WIDTH = 1200;
        const PREVIEW_MAX_HEIGHT = 800;

        // ----- helper: show status message -----
        function setStatus(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.style.color = isError ? '#c0392b' : '#007aff';
            if (!text) statusMsg.textContent = '';
        }

        // ----- enable/disable export -----
        function updateExportState() {
            exportBtn.disabled = !(leftImage && rightImage);
        }

        // ----- clear one slot -----
        function clearLeft() {
            leftImage = null;
            thumbLeft.innerHTML = '<span>＋</span>';
            slotLeft.classList.remove('filled');
            fileLeft.value = '';
            updateExportState();
            drawPreview();
        }

        function clearRight() {
            rightImage = null;
            thumbRight.innerHTML = '<span>＋</span>';
            slotRight.classList.remove('filled');
            fileRight.value = '';
            updateExportState();
            drawPreview();
        }

        // ----- reset all -----
        function resetAll() {
            clearLeft();
            clearRight();
            setStatus('');
            drawPreview(); // draw empty placeholder
        }

        // ----- load image from file, returns Promise<HTMLImageElement> -----
        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) {
                    reject(new Error('Not an image file'));
                    return;
                }
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    // Keep reference to revoke later? We'll store the image and revoke when cleared
                    // We store the object URL on the image for cleanup
                    img._objectURL = url;
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Failed to load image'));
                };
                img.src = url;
            });
        }

        // ----- revoke old object URL if exists -----
        function revokeImageURL(img) {
            if (img && img._objectURL) {
                URL.revokeObjectURL(img._objectURL);
                img._objectURL = null;
            }
        }

        // ----- handle file selection (left) -----
        async function handleLeftFile(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
                setStatus('Loading left photo…');
                const img = await loadImageFromFile(file);
                // revoke previous left image url
                revokeImageURL(leftImage);
                leftImage = img;
                // update thumbnail (show small preview)
                thumbLeft.innerHTML = '';
                const thumbImg = document.createElement('img');
                thumbImg.src = img._objectURL; // same object url, but it's fine
                thumbImg.alt = 'Left photo';
                thumbLeft.appendChild(thumbImg);
                slotLeft.classList.add('filled');
                setStatus('');
                updateExportState();
                drawPreview();
            } catch (err) {
                setStatus('Could not load left photo', true);
                console.error(err);
            }
        }

        async function handleRightFile(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
                setStatus('Loading right photo…');
                const img = await loadImageFromFile(file);
                revokeImageURL(rightImage);
                rightImage = img;
                thumbRight.innerHTML = '';
                const thumbImg = document.createElement('img');
                thumbImg.src = img._objectURL;
                thumbImg.alt = 'Right photo';
                thumbRight.appendChild(thumbImg);
                slotRight.classList.add('filled');
                setStatus('');
                updateExportState();
                drawPreview();
            } catch (err) {
                setStatus('Could not load right photo', true);
                console.error(err);
            }
        }

        // ----- draw preview on canvas (scaled to fit, high quality but for display) -----
        function drawPreview() {
            // If no images, draw a light placeholder
            if (!leftImage && !rightImage) {
                // clear canvas with placeholder
                previewCanvas.width = 600;
                previewCanvas.height = 400;
                ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                ctx.fillStyle = '#f0f0f5';
                ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
                ctx.font = '16px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.fillStyle = '#8e8e93';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Upload two photos', previewCanvas.width/2, previewCanvas.height/2);
                return;
            }

            // If only one image, draw it centered (but UI likely both needed for export, still show preview)
            if (!leftImage || !rightImage) {
                const img = leftImage || rightImage;
                if (!img) return;
                // set canvas to image aspect ratio limited by preview max
                const aspect = img.width / img.height;
                let w = Math.min(PREVIEW_MAX_WIDTH, img.width);
                let h = w / aspect;
                if (h > PREVIEW_MAX_HEIGHT) {
                    h = PREVIEW_MAX_HEIGHT;
                    w = h * aspect;
                }
                // Round for crispness
                w = Math.round(w);
                h = Math.round(h);
                previewCanvas.width = w;
                previewCanvas.height = h;
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                return;
            }

            // --- both images exist: compute layout for preview (scaled down but maintaining aspect) ---
            const leftW = leftImage.width;
            const leftH = leftImage.height;
            const rightW = rightImage.width;
            const rightH = rightImage.height;

            // We want to place them side by side, with gap, without any scaling up (only down for preview)
            // Compute total width and height in natural units:
            const naturalTotalWidth = leftW + GAP_PX + rightW;
            const naturalMaxHeight = Math.max(leftH, rightH);

            // For preview we scale down to fit within PREVIEW_MAX_WIDTH x PREVIEW_MAX_HEIGHT
            const scaleW = PREVIEW_MAX_WIDTH / naturalTotalWidth;
            const scaleH = PREVIEW_MAX_HEIGHT / naturalMaxHeight;
            const previewScale = Math.min(scaleW, scaleH, 1.0); // never upscale for preview

            // Preview canvas dimensions
            const previewWidth = Math.round(naturalTotalWidth * previewScale);
            const previewHeight = Math.round(naturalMaxHeight * previewScale);

            previewCanvas.width = previewWidth;
            previewCanvas.height = previewHeight;
            ctx.clearRect(0, 0, previewWidth, previewHeight);

            // White background (paper)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, previewWidth, previewHeight);

            // Compute scaled dimensions
            const scaledLeftW = leftW * previewScale;
            const scaledLeftH = leftH * previewScale;
            const scaledRightW = rightW * previewScale;
            const scaledRightH = rightH * previewScale;
            const scaledGap = GAP_PX * previewScale;

            // Vertical centering: align tops? or center vertically? For side-by-side prints, top-align is common.
            // We'll top-align (y = 0) so they sit at same baseline top. This is typical for photo strips.
            const leftY = 0;
            const rightY = 0;

            // Draw left image
            ctx.drawImage(leftImage, 0, leftY, scaledLeftW, scaledLeftH);
            // Draw right image with gap
            ctx.drawImage(rightImage, scaledLeftW + scaledGap, rightY, scaledRightW, scaledRightH);

            // Optional: draw a very subtle line in the gap? Not needed; the gap itself is white and will cut.
        }

        // ----- export full-resolution JPEG -----
        function exportFullRes() {
            if (!leftImage || !rightImage) {
                setStatus('Please load both photos first', true);
                return;
            }

            // Use natural dimensions, no scaling
            const leftW = leftImage.width;
            const leftH = leftImage.height;
            const rightW = rightImage.width;
            const rightH = rightImage.height;

            // Output canvas size: sum of widths + gap, max height
            const outWidth = leftW + GAP_PX + rightW;
            const outHeight = Math.max(leftH, rightH);

            // Create full-res canvas
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = outWidth;
            fullCanvas.height = outHeight;
            const fullCtx = fullCanvas.getContext('2d');

            // White background (ensures JPEG has clean white paper feel)
            fullCtx.fillStyle = '#ffffff';
            fullCtx.fillRect(0, 0, outWidth, outHeight);

            // Draw left (top-aligned)
            fullCtx.drawImage(leftImage, 0, 0, leftW, leftH);
            // Draw right with gap
            fullCtx.drawImage(rightImage, leftW + GAP_PX, 0, rightW, rightH);

            // Export as high-quality JPEG
            try {
                const dataURL = fullCanvas.toDataURL('image/jpeg', 1.0); // 1.0 = highest quality
                // Create download link
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
                link.download = `2up-${timestamp}.jpg`;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setStatus('✓ Exported print‑ready JPEG');
                setTimeout(() => setStatus(''), 2500);
            } catch (e) {
                console.error(e);
                setStatus('Export failed — try again', true);
            }
        }

        // ----- attach event listeners -----
        // Slot click triggers file input
        slotLeft.addEventListener('click', () => fileLeft.click());
        slotRight.addEventListener('click', () => fileRight.click());

        // Also handle keyboard
        slotLeft.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileLeft.click();
            }
        });
        slotRight.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileRight.click();
            }
        });

        fileLeft.addEventListener('change', handleLeftFile);
        fileRight.addEventListener('change', handleRightFile);

        // Reset button
        resetBtn.addEventListener('click', resetAll);

        // Export button
        exportBtn.addEventListener('click', exportFullRes);

        // Revoke object URLs before page unload (best effort)
        window.addEventListener('beforeunload', () => {
            revokeImageURL(leftImage);
            revokeImageURL(rightImage);
        });

        // Initial preview (empty state)
        drawPreview();

        // Prevent default drag & drop on slots (avoid accidental navigation)
        [slotLeft, slotRight].forEach(slot => {
            slot.addEventListener('dragover', (e) => e.preventDefault());
            slot.addEventListener('drop', (e) => e.preventDefault());
        });

        // Also allow drag&drop on desktop? optional but not needed for iPhone; keep simple.
        // For desktop convenience, handle drop on slots
        slotLeft.addEventListener('drop', async (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files?.[0];
            if (file && file.type.startsWith('image/')) {
                // simulate file selection
                const dt = new DataTransfer();
                dt.items.add(file);
                fileLeft.files = dt.files;
                await handleLeftFile({ target: { files: dt.files } });
            }
        });
        slotRight.addEventListener('drop', async (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files?.[0];
            if (file && file.type.startsWith('image/')) {
                const dt = new DataTransfer();
                dt.items.add(file);
                fileRight.files = dt.files;
                await handleRightFile({ target: { files: dt.files } });
            }
        });

        // Extra: disable export if either image missing (redundant)
        // But updateExportState already does it.
    })();
</script>
</body>
</html>
